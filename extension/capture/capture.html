<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>webSave: capturing</title>
  <link rel="stylesheet" href="capture.css">
  <link rel="stylesheet" href="print.css">
  <script src="../vendor/browser-polyfill.js"></script>
  <script src="../vendor/Readability.js"></script>
  <script type="module" src="capture.js"></script>
</head>
<body>
  <main id="progress">
    <h1>Saving as PDF</h1>
    <p id="status" role="status">Starting…</p>
    <p id="warning" hidden>Without access to all sites most images will be missing.</p>
    <div id="access" hidden>
      <p>To include images from other sites, webSave needs access to all sites.</p>
      <button type="button" id="allow-access">Allow access</button>
      <button type="button" id="skip-access">Continue without</button>
    </div>
    <p id="error" hidden></p>
    <button type="button" id="cancel">Cancel</button>
    <div id="cancelled" hidden>
      <p id="cancelled-text"></p>
      <button type="button" id="make-pdf">Make PDF</button>
      <button type="button" id="discard">Discard</button>
    </div>
  </main>
</body>
</html>
